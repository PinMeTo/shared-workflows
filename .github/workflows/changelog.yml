name: Changelog

# Reusable check that CHANGELOG.md follows the version in package.json.
# Usage and rules: see README.md.

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory with package.json and CHANGELOG.md, relative to the repo root.
        type: string
        default: "."
      require-bump:
        description: Fail every PR that does not bump the version.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "$BASE_REF"

      - name: Top CHANGELOG.md section matches the version change
        env:
          BASE_REF: ${{ github.base_ref }}
          PACKAGE_DIR: ${{ inputs.package-dir }}
          REQUIRE_BUMP: ${{ inputs.require-bump }}
        run: |
          set -euo pipefail

          dir="${PACKAGE_DIR%/}"
          prefix=""
          if [ "$dir" != "." ] && [ -n "$dir" ]; then
            prefix="$dir/"
          fi
          changelog="${prefix}CHANGELOG.md"
          package_json="${prefix}package.json"

          if [ ! -f "$changelog" ]; then
            echo "::error::$changelog not found."
            exit 1
          fi

          heading_pattern='^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$'

          top_heading="$(grep -m1 -E '^## ' "$changelog" || true)"
          base_top_heading="$(git show "origin/${BASE_REF}:${changelog}" 2>/dev/null | grep -m1 -E '^## ' || true)"
          top_section="$(awk '/^## /{n++} n==1' "$changelog")"
          base_top_section="$(git show "origin/${BASE_REF}:${changelog}" 2>/dev/null | awk '/^## /{n++} n==1' || true)"
          package_version="$(jq -r .version "$package_json")"
          base_version="$(git show "origin/${BASE_REF}:${package_json}" 2>/dev/null | jq -r .version || true)"

          echo "$package_json: '$base_version' -> '$package_version'"
          echo "$changelog top: '$base_top_heading' -> '$top_heading'"

          if [ "$package_version" = "$base_version" ]; then
            if [ "$REQUIRE_BUMP" = "true" ]; then
              echo "::error file=${package_json}::This repo requires a version bump on every PR. Bump $package_json above $base_version and add a matching section at the top of $changelog."
              exit 1
            fi
            if [ -n "$base_top_section" ] && [ "$top_section" != "$base_top_section" ]; then
              echo "::error file=${changelog}::The top section of $changelog changed but $package_json is still $package_version. The top section documents a released version. Bump the version and add the notes in a new section at the top."
              exit 1
            fi
            echo "OK: version unchanged, top section unchanged."
            exit 0
          fi

          if [ -n "$base_version" ]; then
            highest="$(printf '%s\n%s\n' "$base_version" "$package_version" | sort -V | tail -n1)"
            if [ "$highest" != "$package_version" ]; then
              echo "::error file=${package_json}::Version $package_version is lower than ${BASE_REF} ($base_version)."
              exit 1
            fi
          fi

          changelog_version="$(printf '%s\n' "$top_heading" | sed -nE "s/${heading_pattern}/\1/p")"
          if [ -z "$changelog_version" ]; then
            echo "::error file=${changelog}::Top section heading must be '## [X.Y.Z] - YYYY-MM-DD', found: '${top_heading}'."
            exit 1
          fi

          if [ "$changelog_version" != "$package_version" ]; then
            echo "::error file=${changelog}::$package_json is $package_version but the top section of $changelog is $changelog_version. Add a section for $package_version at the top."
            exit 1
          fi

          echo "OK: $package_version is documented at the top of $changelog."
