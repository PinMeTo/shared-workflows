name: "Dependency Review"
on: [pull_request]

permissions:
  contents: read

# Each repo keeps its own exceptions in .github/dependency-review-config.yml
# (allow-ghsas, with a comment on why and when to remove each one). Add an
# exception in the PR that introduces the advisory.
# Inline inputs override the config file, so the severity threshold, the scope and the
# vulnerability check itself stay fixed here.

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: ${{ hashFiles('.github/dependency-review-config.yml') != '' && './.github/dependency-review-config.yml' || '' }}
          fail-on-severity: high
          fail-on-scopes: runtime
          vulnerability-check: true
          warn-only: false
