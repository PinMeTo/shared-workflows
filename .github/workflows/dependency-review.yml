name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Every GHSA after the first one is temporary for the yarn to npm migration
          allow-ghsas: GHSA-jmr7-xgp7-cmfj,GHSA-vfj7-8cjw-p6xm,GHSA-c475-qrg2-pj4r,GHSA-2fw4-mgq9-39cx,GHSA-4rg6-fm25-gc34,GHSA-4w4v-5hc9-xrr2,GHSA-7x27-g8rg-x87w,GHSA-p6mc-m468-83gw,GHSA-7pqw-9j4j-h8q3,GHSA-jmr9-qjv8-65gv