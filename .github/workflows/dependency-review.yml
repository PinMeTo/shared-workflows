name: "Dependency Review"
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # GHSA-jmr7-xgp7-cmfj: fast-xml-parser in aws-sdk. GHSA-73rg-x683-m3qw: canvas.
          allow-ghsas: GHSA-jmr7-xgp7-cmfj,GHSA-73rg-x683-m3qw
