name: Require risk assessment label

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

jobs:
  check-risk-label:
    name: Risk label present
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for risk label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh api repos/$REPO/issues/$PR_NUMBER/labels --jq '.[].name')
          echo "Labels on PR: $labels"
          if echo "$labels" | grep -qxF "Low risk" || \
             echo "$labels" | grep -qxF "Medium risk" || \
             echo "$labels" | grep -qxF "High risk"; then
            echo "Risk label found — OK to merge."
          else
            echo "::error::A risk assessment label is required before merging."
            echo "::error::Add one of: 'Low risk', 'Medium risk', or 'High risk'."
            exit 1
          fi
