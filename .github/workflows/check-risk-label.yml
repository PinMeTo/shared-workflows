name: Require risk assessment label

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

jobs:
  check-risk-label:
    name: Risk label present
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for risk label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -qE '"(Low risk|Medium risk|High risk)"'; then
            echo "Risk label found — OK to merge."
          else
            echo "::error::A risk assessment label is required before merging."
            echo "::error::Add one of: 'Low risk', 'Medium risk', or 'High risk'."
            exit 1
          fi
